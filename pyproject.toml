[project]
name = "loglens"
version = "1.2.0"
description = "Tiny structured-log line parser -- one function, zero dependencies"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "loglens contributors" }]
keywords = ["logging", "parser", "structured-logs", "log-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Logging",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-loglens-reports @ git+https://github.com/iamdagger/pytest-loglens-reports.git@v0.1.3",
]

[project.urls]
Homepage = "https://github.com/iamdagger/loglens"
Repository = "https://github.com/iamdagger/loglens"
Issues = "https://github.com/iamdagger/loglens/issues"
Changelog = "https://github.com/iamdagger/loglens/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["loglens"]
